  <head>
    <meta charset="UTF-8" />

    <title>Atmo Viz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <style>
      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(156, 163, 175, 0.5);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(156, 163, 175, 0.8);
      }
      /* Hide scrollbar for horizontal scrolling areas on mobile */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }

      /* Custom styling for Leaflet Photo Popups & Tooltips */
      .photo-leaflet-popup .leaflet-popup-content-wrapper {
        background: rgba(15, 23, 42, 0.96) !important;
        color: #fff !important;
        border-radius: 1.25rem !important;
        padding: 2px !important;
        border: 1px solid rgba(255, 255, 255, 0.15) !important;
        box-shadow: 0 20px 30px -5px rgba(0, 0, 0, 0.7), 0 10px 15px -5px rgba(0, 0, 0, 0.5) !important;
        backdrop-filter: blur(12px) !important;
      }
      .photo-leaflet-popup .leaflet-popup-tip {
        background: rgba(15, 23, 42, 0.96) !important;
        border: 1px solid rgba(255, 255, 255, 0.15) !important;
      }
      .photo-leaflet-popup .leaflet-popup-content {
        margin: 6px !important;
        line-height: 1.4 !important;
      }
      .photo-leaflet-popup .leaflet-popup-close-button {
        color: #94a3b8 !important;
        padding: 6px 8px 0 0 !important;
        font-size: 18px !important;
      }
      .photo-leaflet-popup .leaflet-popup-close-button:hover {
        color: #f43f5e !important;
      }

      .photo-leaflet-tooltip {
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
        pointer-events: auto !important;
      }
      .photo-leaflet-tooltip::before {
        display: none !important;
      }
    </style>
